<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DietPlanner Recipe Importer</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main>
      <header class="heading">
        <img src="icon.png" alt="" width="42" height="42">
        <div>
          <h1>DietPlanner</h1>
          <p>Recipe importer</p>
        </div>
      </header>

      <button id="add-current" class="primary" type="button">
        Add Current Recipe
      </button>
      <p id="action-message" class="action-message" role="status" aria-live="polite"></p>

      <section aria-labelledby="status-heading">
        <div class="section-heading">
          <h2 id="status-heading">Recent pages</h2>
          <button id="clear-finished" class="text-button" type="button">
            Clear finished
          </button>
        </div>
        <p id="empty-state" class="empty-state">
          Pages you send to DietPlanner will appear here.
        </p>
        <ol id="job-list" class="job-list"></ol>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
