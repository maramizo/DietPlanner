name: Build and Release

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: dietplanner-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Choose release version
        id: version
        shell: pwsh
        run: |
          $version = "1.0.${{ github.run_number }}"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Restore
        shell: pwsh
        run: dotnet restore .\src\DietPlanner.sln

      - name: Publish Windows application
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          dotnet publish .\src\DietPlanner.vbproj `
            --configuration Release `
            --no-restore `
            --output .\publish `
            -p:Version=$version `
            -p:AssemblyVersion="${version}.0" `
            -p:FileVersion="${version}.0" `
            -p:InformationalVersion="${version}+$env:GITHUB_SHA"

      - name: Package and checksum
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath .\publish\data) {
            throw "Release packages must never contain the user's data directory."
          }
          Compress-Archive -Path .\publish\* -DestinationPath .\release.zip -CompressionLevel Optimal
          $hash = (Get-FileHash -LiteralPath .\release.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  release.zip" | Set-Content -LiteralPath .\release.zip.sha256 -Encoding ascii

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: DietPlanner-${{ steps.version.outputs.version }}
          path: |
            release.zip
            release.zip.sha256
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packaged application
        uses: actions/download-artifact@v8
        with:
          name: DietPlanner-${{ needs.build.outputs.version }}
          path: release-assets

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ needs.build.outputs.version }}"
          $tag = "v$version"
          $title = "DietPlanner $version"

          gh release create $tag `
            ./release-assets/release.zip `
            ./release-assets/release.zip.sha256 `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title $title `
            --generate-notes `
            --latest
